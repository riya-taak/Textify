<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textify</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1 class="title">Textify </h1>
  <div id="cont">
    <textarea id="inp" rows="10" placeholder="Write your text here"></textarea>
    <div id="btns">
      <button type="submit" id="lower" class="Btn">Lower</button>
      <button type="submit" id="upper" class="Btn">Upper</button>
      <button type="submit" id="trim" class="Btn">Trim</button>
      <button type="submit" id='caps' class="Btn">Caps</button>
      <button type="submit" id='copy' class="Btn">Copy</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
